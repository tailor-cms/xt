name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: npm i -g corepack@latest && corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "pnpm"
      - run: pnpm i
      - run: pnpm lint
